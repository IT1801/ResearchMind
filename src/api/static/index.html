<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ResearchMind</title>
  <style>
    :root {
      --ink: #17211f;
      --muted: #71807b;
      --paper: #f6f5ef;
      --panel: #fffefa;
      --line: #dfe4dc;
      --accent: #176b5b;
      --accent-dark: #0e4c41;
      --soft: #e7f0e9;
      --shadow: 0 18px 60px rgba(26, 51, 44, .10);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: radial-gradient(circle at 12% 8%, #e3eee4 0, transparent 28rem), var(--paper);
      font: 16px/1.55 Georgia, "Times New Roman", serif;
    }
    button, textarea { font: inherit; }
    .shell { width: min(980px, calc(100% - 32px)); margin: 0 auto; padding: 36px 0 56px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    .eyebrow { color: var(--accent); font: 700 12px/1.2 ui-sans-serif, system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 7px 0 0; font: 700 clamp(32px, 6vw, 58px)/.98 Georgia, serif; letter-spacing: 0; }
    .tagline { max-width: 270px; margin: 0; color: var(--muted); font: 14px/1.45 ui-sans-serif, system-ui, sans-serif; }
    .chat { min-height: 560px; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: rgba(255, 254, 250, .78); box-shadow: var(--shadow); }
    .conversation { min-height: 380px; padding: clamp(20px, 5vw, 44px); }
    .welcome { max-width: 620px; padding: 32px 0; }
    .welcome h2 { margin: 0 0 10px; font-size: 30px; line-height: 1.05; }
    .welcome p { margin: 0; color: var(--muted); }
    .message { display: grid; gap: 8px; max-width: 760px; margin-bottom: 28px; }
    .message.user { margin-left: auto; justify-items: end; }
    .label { color: var(--muted); font: 700 11px/1.2 ui-sans-serif, system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
    .bubble { padding: 14px 17px; border-radius: 10px; white-space: pre-wrap; }
    .user .bubble { color: white; background: var(--accent-dark); }
    .assistant .bubble { border: 1px solid var(--line); background: var(--panel); }
    .sources { display: grid; gap: 8px; margin-top: 12px; }
    details { border-top: 1px solid var(--line); padding-top: 8px; }
    summary { cursor: pointer; color: var(--accent); font: 700 13px ui-sans-serif, system-ui, sans-serif; }
    .source-text { margin: 8px 0 4px; color: #42514c; font-size: 14px; }
    .source-meta { color: var(--muted); font: 11px ui-sans-serif, system-ui, sans-serif; }
    .composer { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; padding: 18px; border-top: 1px solid var(--line); background: var(--panel); }
    textarea { width: 100%; min-height: 52px; max-height: 160px; resize: vertical; padding: 14px 15px; border: 1px solid var(--line); border-radius: 8px; outline: none; color: var(--ink); background: #fbfcf8; }
    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(23, 107, 91, .12); }
    button { min-height: 52px; padding: 0 22px; border: 0; border-radius: 8px; cursor: pointer; color: white; background: var(--accent); font: 700 14px ui-sans-serif, system-ui, sans-serif; }
    button:hover { background: var(--accent-dark); }
    button:disabled { cursor: wait; opacity: .55; }
    .status { min-height: 22px; padding: 0 18px 12px; color: var(--muted); font: 12px ui-sans-serif, system-ui, sans-serif; }
    @media (max-width: 620px) {
      .shell { width: min(100% - 20px, 980px); padding-top: 22px; }
      header { display: block; }
      .tagline { max-width: none; margin-top: 14px; }
      .composer { grid-template-columns: 1fr; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div><div class="eyebrow">Research assistant</div><h1>ResearchMind</h1></div>
      <p class="tagline">Ask a question. Search the corpus. Keep the evidence close.</p>
    </header>
    <section class="chat" aria-label="ResearchMind chat">
      <div class="conversation" id="conversation">
        <div class="welcome" id="welcome">
          <h2>What are you investigating?</h2>
          <p>ResearchMind combines semantic search, BM25, reranking, and compressed parent context to answer from your collection.</p>
        </div>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
      <form class="composer" id="composer">
        <textarea id="query" aria-label="Research question" placeholder="Ask a research question..." required></textarea>
        <button id="send" type="submit">Ask ResearchMind</button>
      </form>
    </section>
  </main>
  <script>
    const conversation = document.querySelector('#conversation');
    const form = document.querySelector('#composer');
    const input = document.querySelector('#query');
    const send = document.querySelector('#send');
    const status = document.querySelector('#status');
    const welcome = document.querySelector('#welcome');

    function addMessage(kind, label, content) {
      const message = document.createElement('article');
      message.className = `message ${kind}`;
      message.innerHTML = `<div class="label">${label}</div><div class="bubble"></div>`;
      message.querySelector('.bubble').textContent = content;
      conversation.appendChild(message);
      message.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      return message;
    }

    function addSources(parent, results) {
      if (!results.length) return;
      const sources = document.createElement('div');
      sources.className = 'sources';
      results.forEach((result, index) => {
        const details = document.createElement('details');
        details.innerHTML = `<summary>Source ${index + 1} · score ${Number(result.score).toFixed(3)}</summary><p class="source-text"></p><div class="source-meta"></div>`;
        details.querySelector('.source-text').textContent = result.content;
        details.querySelector('.source-meta').textContent = result.metadata.id ? `Paper ${result.metadata.id}` : 'Parent context';
        sources.appendChild(details);
      });
      parent.appendChild(sources);
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const query = input.value.trim();
      if (!query || send.disabled) return;
      welcome?.remove();
      addMessage('user', 'You', query);
      input.value = '';
      send.disabled = true;
      status.textContent = 'Searching the research collection...';
      try {
        const response = await fetch('/query', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query, top_k: 10 })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'The request failed.');
        const assistant = addMessage('assistant', 'ResearchMind', data.answer || 'No answer was generated.');
        addSources(assistant, data.results || []);
        status.textContent = `${(data.results || []).length} evidence sources returned`;
      } catch (error) {
        addMessage('assistant', 'ResearchMind', `I could not complete that search: ${error.message}`);
        status.textContent = 'Request failed';
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
